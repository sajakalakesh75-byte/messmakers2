<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mess Makers – Our Services</title>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1dc;--card:#fff8ec;--ink:#111;--pink:#ff1f8e;--soft:#f06fa0;--line:#f3dcbc;--chip:#ffe3bf;--tex:.12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1620;--card:#2c212f;--ink:#fff4e6;--line:#43344a;--chip:#3a2b40;--tex:.07}}
:root[data-theme="dark"]{--bg:#1e1620;--card:#2c212f;--ink:#fff4e6;--line:#43344a;--chip:#3a2b40;--tex:.07}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--tex);background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><g fill='%23ff1f8e'><circle cx='24' cy='30' r='5'/><circle cx='34' cy='38' r='2'/><circle cx='150' cy='170' r='6'/><circle cx='160' cy='182' r='2.5'/></g><g fill='%231f8fff'><circle cx='120' cy='22' r='6'/><circle cx='132' cy='32' r='2'/><circle cx='36' cy='150' r='5'/></g><g fill='%23ffd90f'><circle cx='188' cy='84' r='7'/><circle cx='176' cy='96' r='2.5'/><circle cx='80' cy='100' r='4'/></g><g fill='%2317d68a'><circle cx='70' cy='196' r='5'/><circle cx='82' cy='204' r='2'/><circle cx='200' cy='20' r='3'/></g><g fill='%23ff8a1f'><circle cx='100' cy='150' r='5'/><circle cx='20' cy='96' r='3'/></g><g fill='%239b6cf0'><circle cx='180' cy='140' r='4'/><circle cx='60' cy='60' r='3'/></g><g fill='none' stroke-width='3' stroke-linecap='round'><path d='M70 30q6-6 12 0' stroke='%23ff4d5e'/><path d='M150 110q6-6 12 0' stroke='%231f8fff'/><path d='M20 190q6-6 12 0' stroke='%23ff8a1f'/><path d='M120 70q6-6 12 0' stroke='%239b6cf0'/></g></svg>") 0 0/220px 220px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;padding-bottom:110px}
.drips{display:flex;height:120px;max-width:720px;margin:0 auto;padding:0 8%}
.drips i{flex:1;border-radius:0 0 40px 40px;margin:0 1px;animation:drip 3.2s ease-in-out infinite alternate}
@keyframes drip{to{transform:scaleY(1.12);transform-origin:top}}
.hero{text-align:center;padding:10px 16px 8px}
.logo{width:96px;height:96px;margin:0 auto}
.brand{font-family:Chewy,cursive;font-size:1.2rem;margin-top:-4px}
.hero .script{font-family:Caveat,cursive;font-size:2.4rem;line-height:1;margin-top:18px}
.hero h1{font-family:Chewy,cursive;font-weight:400;color:var(--pink);font-size:4.2rem;line-height:1;margin:0}
.hero p{margin:8px auto 0;max-width:30ch;opacity:.75;font-size:.9rem}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px;border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.search{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 16px;font:600 .9rem Poppins,sans-serif;margin-bottom:8px}
.search:focus{outline:none;border-color:var(--pink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:600 .8rem Poppins,sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pink);color:#fff}
section{margin-top:26px}
h2{font-family:Chewy,cursive;font-weight:400;color:var(--soft);font-size:2.2rem;margin:0 0 10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 10px 12px;text-align:center;cursor:pointer;font:700 .88rem Poppins,sans-serif;color:var(--ink);transition:transform .12s,border-color .12s}
.item:active{transform:scale(.96)}
.item .em{display:block;font-size:2.2rem;margin-bottom:6px}
.item .d{display:block;font-weight:500;font-size:.72rem;line-height:1.35;opacity:.7;margin-top:4px}
.item .add{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--pink);display:grid;place-items:center;font-size:1.1rem;line-height:1}
.item.sel{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,var(--card))}
.item.sel .add{background:var(--pink);color:#fff}
.empty{text-align:center;padding:40px 0;opacity:.7;display:none}
.fab{position:fixed;left:50%;transform:translate(-50%,0);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--pink);color:#fff;border:0;border-radius:99px;padding:14px 24px;font:700 .95rem Poppins,sans-serif;box-shadow:0 8px 24px #ff1f8e66;cursor:pointer;display:none;z-index:6}
.fab.show{display:block}
.sheet{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:80%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.panel h3{font-family:Chewy,cursive;font-weight:400;color:var(--pink);font-size:1.8rem;margin:0 0 4px}
.panel ul{list-style:none;padding:0;margin:12px 0}
.panel li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:.9rem}
.panel li button{border:0;background:none;color:var(--pink);font-size:1.2rem;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:0;border-radius:99px;padding:12px;font:700 .85rem Poppins,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.p{background:var(--pink);color:#fff}.s{background:var(--chip);color:var(--ink)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
footer{text-align:center;opacity:.6;font-size:.78rem;margin-top:34px}
</style>
</head>
<body>
<div class="drips" aria-hidden="true">
<i style="background:#9b6cf0;height:70%"></i><i style="background:#1f8fff;height:55%"></i><i style="background:#17d68a;height:95%"></i><i style="background:#ffd90f;height:100%"></i><i style="background:#ff8a1f;height:65%"></i><i style="background:#ff4d5e;height:85%"></i>
</div>
<header class="hero">
<svg class="logo" viewBox="0 0 100 100" aria-label="Mess Makers logo"><circle cx="50" cy="50" r="40" fill="none" stroke="#f0357f" stroke-width="1.5"/><circle cx="40" cy="38" r="17" fill="#f06fa0"/><circle cx="58" cy="36" r="15" fill="#2fb7ee"/><circle cx="32" cy="55" r="13" fill="#ffd90f"/><circle cx="52" cy="56" r="14" fill="#ff9a2e"/><circle cx="68" cy="52" r="10" fill="#b7d33a"/><text x="50" y="58" text-anchor="middle" font-family="Caveat,cursive" font-size="30" fill="#111">MM</text></svg>
<div class="brand">Mess Makers</div>
<div class="script">Our Services</div>
<h1>Menu 🎈</h1>
<p>Tap what you love to build your party wish list.</p>
</header>

<div class="bar"><div class="wrap">
<input class="search" id="q" type="search" placeholder="Search activities…" aria-label="Search activities">
<div class="chips" id="chips"></div>
</div></div>

<main class="wrap" id="menu"></main>
<div class="wrap empty" id="empty">No matches — try another word 🔍</div>
<footer>Mess Makers · Let's get messy! 🎨</footer>

<button class="fab" id="fab"></button>
<div class="sheet" id="sheet"><div class="panel">
<h3>My Wish List</h3>
<div style="font-size:.8rem;opacity:.7">Send it to us and we'll get back with prices &amp; availability.</div>
<ul id="list"></ul>
<div class="row">
<a class="btn p" id="wa" target="_blank" rel="noopener">Send on WhatsApp</a>
<button class="btn s" id="copy">Copy list</button>
<button class="btn s" id="clear">Clear</button>
<button class="btn s" id="close">Close</button>
</div></div></div>
<div class="toast" id="toast"></div>

<script>
const DATA=[
["Slime Station","🧪",[["Slime","🟢"],["Birthday slime","🎂"],["Pizza slime","🍕"],["Donut slime","🍩"]]],
["Bedazzling","💎",[["Puff","☁️"],["Duck","🦆"],["Keychain","🔑"],["Random","🎲"]]],
["Themed Activities","👑",[["Princess spa","👸"],["Spa day","🧖‍♀️"],["Escape room","🗝️"],["Lavender dream","💜"],["Mini chef","👩‍🍳"],["Interactive science","🔬"]]],
["Painting","🎨",[["Canvas painting","🖼️"],["Ceramic painting","🏺"],["Tote bag painting","👜"],["T-shirt painting","👕"],["Mug coloring","☕"],["Face mask painting","🎭"]]],
["Candles Studio","🕯️",[["Coffee candles","☕"],["Cake candles","🍰"]]],
["Live Activities","🎉",[["Save your balloons","🎈"],["Musical chairs","🪑"],["Shake it out challenge","💃"],["Guessing box","📦"],["Eggs and spoons","🥚"],["Potato bags","🥔"],["Memory flash card","🃏"],["Snake and ladder","🐍"],["Fish and shark","🦈"],["Buzz and answer","🔔"],["Random live activities","🎯"]]],
["Science","🌋",[["Volcano eruption","🌋"],["Lightning ball","⚡"],["Electric circuit","💡"],["Tornado","🌪️"]]],
["DIY Activities","✂️",[["Dinosaur egg","🦖"],["Fashion designers","👗"],["Bird house","🐦"],["Bracelets","📿"],["Keyring","🔑"],["Puppets","🧸"],["Sewing little animals","🪡"],["Mirror decoration","🪞"],["Mini garden","🌱"],["Mini farmers","🚜"],["Random craft","🧵"]]],
["Toddlers","🧸",[["Sand coloring","🏖️"],["Playdough party","🟠"],["Fishing","🎣"],["Sensory","🤲"],["Pom pom coloring","🔴"],["Magic sand","✨"],["Foam painting","🫧"],["Stickers","⭐"],["Pocking craft","🧩"]]],
["Carts","🛒",[["Bedazzling cart","💎"],["Slime cart","🟢"],["Bracelets cart","📿"],["Painting cart","🎨"]]]
];
const DESC={
"Slime":"Mix, stretch and squish your own colorful slime.",
"Birthday slime":"Party-themed slime with sprinkles and confetti.",
"Pizza slime":"Slime that looks like a cheesy pizza slice.",
"Donut slime":"Fluffy, frosted donut-style slime.",
"Puff":"Decorate a soft puff with gems and charms.",
"Duck":"Bedazzle a cute duck with sparkly gems.",
"Keychain":"Gem up a keychain to carry everywhere.",
"Random":"A surprise item to bedazzle, picked for you.",
"Princess spa":"Crowns, glitter and pampering fit for a princess.",
"Spa day":"Relaxing masks and pampering for little guests.",
"Escape room":"Solve clues and puzzles together to beat the clock.",
"Lavender dream":"A calming lavender-themed make-and-take.",
"Mini chef":"Kids cook and decorate their own tasty treats.",
"Interactive science":"Hands-on experiments full of fizz and wow.",
"Canvas painting":"Paint your own masterpiece to hang at home.",
"Ceramic painting":"Color a ceramic piece to keep forever.",
"Tote bag painting":"Design a one-of-a-kind tote bag.",
"T-shirt painting":"Paint a custom T-shirt to wear proudly.",
"Mug coloring":"Personalize a mug with your own artwork.",
"Face mask painting":"Paint and decorate a fun face mask.",
"Coffee candles":"Pour a cozy candle in a coffee-cup style.",
"Cake candles":"Make a candle that looks like a sweet cake.",
"Save your balloons":"Protect your balloon while popping others'.",
"Musical chairs":"Dance to the music, grab a seat when it stops.",
"Shake it out challenge":"A silly dance-and-wiggle challenge.",
"Guessing box":"Reach in, feel and guess the mystery item.",
"Eggs and spoons":"Race while balancing an egg on a spoon.",
"Potato bags":"Hop to the finish line in a sack.",
"Memory flash card":"Match the cards and test your memory.",
"Snake and ladder":"A giant live version of the classic game.",
"Fish and shark":"Swim across without getting caught by the shark.",
"Buzz and answer":"Quick-fire quiz: buzz in first with the answer.",
"Random live activities":"A mix of surprise party games with our host.",
"Volcano eruption":"Build a volcano and watch it bubble and erupt.",
"Lightning ball":"See sparks of 'lightning' in a hands-on experiment.",
"Electric circuit":"Build a simple circuit and light up a bulb.",
"Tornado":"Create a swirling tornado in a bottle.",
"Dinosaur egg":"Crack open an egg to discover a hidden dino.",
"Fashion designers":"Design and decorate your own fashion looks.",
"Bird house":"Build and paint a little home for birds.",
"Bracelets":"String beads into a bracelet to wear or gift.",
"Keyring":"Craft a personalized keyring with beads and charms.",
"Puppets":"Make a puppet and bring it to life.",
"Sewing little animals":"Stitch and stuff your own tiny plush friend.",
"Mirror decoration":"Decorate a mirror with gems and colors.",
"Mini garden":"Plant and decorate your own tiny garden.",
"Mini farmers":"Plant seeds and play farmer for the day.",
"Random craft":"A surprise craft picked for the group.",
"Sand coloring":"Fill pictures with colored sand.",
"Playdough party":"Squish, roll and mold with colorful playdough.",
"Fishing":"Catch toy fish in a gentle fishing game.",
"Sensory":"Touch, scoop and explore different textures.",
"Pom pom coloring":"Stick colorful pom poms to make a picture.",
"Magic sand":"Moldable sand that's fun to shape.",
"Foam painting":"Paint with soft, fluffy foam.",
"Stickers":"Decorate with a pile of fun stickers.",
"Pocking craft":"A fine-motor poking craft for little fingers.",
"Bedazzling cart":"A mobile gem-decorating station for your event.",
"Slime cart":"A mobile slime-making station for your event.",
"Bracelets cart":"A mobile bracelet station for your event.",
"Painting cart":"A mobile painting station for your event."};
const $=s=>document.querySelector(s);
let picks=[];
try{picks=JSON.parse(localStorage.getItem("mm_picks")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("mm_picks",JSON.stringify(picks))}catch(e){}};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const menu=$("#menu"),chips=$("#chips");
DATA.forEach(([t,ic,items])=>{
  const b=document.createElement("button");b.className="chip";b.textContent=ic+" "+t;b.dataset.id=slug(t);
  b.onclick=()=>document.getElementById(slug(t)).scrollIntoView();chips.appendChild(b);
  const s=document.createElement("section");s.id=slug(t);
  s.innerHTML=`<h2>${t}</h2><div class="grid"></div>`;
  const g=s.querySelector(".grid");
  items.forEach(([n,e])=>{
    const i=document.createElement("button");i.className="item";i.dataset.n=n;
    i.innerHTML=`<span class="add">+</span><span class="em">${e}</span>${n}<small class="d">${DESC[n]||""}</small>`;
    i.onclick=()=>toggle(n);g.appendChild(i);
  });
  menu.appendChild(s);
});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1400)}
function toggle(n){const k=picks.indexOf(n);k<0?(picks.push(n),toast("Added ✨")):(picks.splice(k,1),toast("Removed"));save();sync()}
function sync(){
  document.querySelectorAll(".item").forEach(i=>{const on=picks.includes(i.dataset.n);i.classList.toggle("sel",on);i.querySelector(".add").textContent=on?"✓":"+"});
  const f=$("#fab");f.classList.toggle("show",picks.length>0);f.textContent="💖 My Wish List ("+picks.length+")";
  $("#list").innerHTML=picks.map((n,i)=>`<li>${n}<button data-i="${i}" aria-label="Remove">✕</button></li>`).join("")||"<li>Nothing yet — tap items to add!</li>";
  const txt="Hi Mess Makers! I'm interested in:\n"+picks.map(n=>"• "+n).join("\n");
  $("#wa").href="https://wa.me/?text="+encodeURIComponent(txt);
}
$("#list").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){picks.splice(+i,1);save();sync();if(!picks.length)$("#sheet").classList.remove("open")}};
$("#fab").onclick=()=>$("#sheet").classList.add("open");
$("#close").onclick=()=>$("#sheet").classList.remove("open");
$("#sheet").onclick=e=>{if(e.target.id==="sheet")e.target.classList.remove("open")};
$("#clear").onclick=()=>{picks=[];save();sync();$("#sheet").classList.remove("open")};
$("#copy").onclick=async()=>{const t="Mess Makers wish list:\n"+picks.map(n=>"• "+n).join("\n");try{await navigator.clipboard.writeText(t);toast("Copied 📋")}catch(e){toast("Copy not available")}};
$("#q").oninput=e=>{
  const v=e.target.value.trim().toLowerCase();let any=false;
  document.querySelectorAll("section").forEach(s=>{let c=0;
    s.querySelectorAll(".item").forEach(i=>{const m=!v||(i.dataset.n+i.textContent).toLowerCase().includes(v)||s.querySelector("h2").textContent.toLowerCase().includes(v);i.style.display=m?"":"none";if(m)c++});
    s.style.display=c?"":"none";if(c)any=true});
  $("#empty").style.display=any?"none":"block";
};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".chip").forEach(c=>{const on=c.dataset.id===e.target.id;c.classList.toggle("on",on);if(on)c.scrollIntoView({inline:"center",block:"nearest"})})}}),{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll("section").forEach(s=>io.observe(s));
sync();
</script>
</body>
</html>
